<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FichaEPI - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --primary: #4F46E5;
    --sidebar-bg: #0F1B3D;
    --fundo: #F8F9FC;
    --borda: #E2E5EC;
    --texto-suave: #697386;
    --destaque: #F7194B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--sidebar-bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card-login {
    background: white;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .brand-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), #3730A3);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    font-weight: 700;
  }
  h1 { font-size: 1.3rem; margin: 0 0 6px; color: var(--sidebar-bg); }
  p.subtitulo { color: var(--texto-suave); font-size: 0.9rem; margin: 0 0 28px; }
  #g_id_signin { display: flex; justify-content: center; margin-bottom: 16px; }
  #status { font-size: 0.9rem; margin-top: 16px; min-height: 20px; }
  #status.erro { color: var(--destaque); }
  #status.sucesso { color: #16a34a; }
  #status.carregando { color: var(--texto-suave); }

  footer {
    margin-top: 24px;
    text-align: center;
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
  }
  footer a {
    color: #A5ADCB;
    font-size: 0.8rem;
    text-decoration: none;
  }
  footer a:hover {
    color: #ffffff;
    text-decoration: underline;
  }
  footer .separador {
    color: #4B5578;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="card-login">
    <div class="brand-icon">EPI</div>
    <h1>FichaEPI</h1>
    <p class="subtitulo">Entre com sua conta Google para acessar o painel da sua empresa.</p>
    <div id="g_id_signin"></div>
    <p id="status"></p>
  </div>
  <footer>
    <a href="politica-de-privacidade.html">Política de Privacidade</a>
    <span class="separador">•</span>
    <a href="termos-de-uso.html">Termos de Uso</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
